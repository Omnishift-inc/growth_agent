<template>
    <lightning-card icon-name="standard:event">
        <span slot="title">Marketing Calendar <span class="src">Account Engagement</span></span>
        <div slot="actions" class="nav">
            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous week" onclick={prev} size="small"></lightning-button-icon>
            <lightning-button label="This week" variant="base" onclick={today}></lightning-button>
            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next week" onclick={next} size="small"></lightning-button-icon>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="range">{rangeLabel} <span class="summary">{summary}</span></p>

            <template if:true={error}>
                <p class="err" role="alert">Could not read the marketing calendar.</p>
            </template>

            <template if:true={isLoading}>
                <div class="grid skelgrid" aria-busy="true"><div class="day skel__d"></div><div class="day skel__d"></div><div class="day skel__d"></div><div class="day skel__d"></div><div class="day skel__d"></div><div class="day skel__d"></div><div class="day skel__d"></div></div>
            </template>
            <template if:false={isLoading}>
            <div class="grid" role="grid" aria-label="Marketing calendar, one week">
                <template for:each={days} for:item="d">
                    <div key={d.key} class={d.cls} role="gridcell">
                        <div class="day__head">
                            <span class="day__name">{d.name}</span>
                            <span class="day__num">{d.num}</span>
                        </div>
                        <template for:each={d.sends} for:item="s">
                            <div key={s.key} class={s.cls}>
                                <button class="send__btn" title={s.audience} data-key={s.key} aria-expanded={s.open} onclick={toggleEntry}>
                                    <span class="send__label">{s.label}</span>
                                    <span class="send__meta">{s.type} · {s.peopleLabel}</span>
                                    <template if:true={s.hasDeferred}>
                                        <span class="send__held">{s.deferredLabel}</span>
                                    </template>
                                </button>
                                <template if:true={s.open}>
                                    <ul class="people">
                                        <template for:each={s.recipients} for:item="p">
                                            <li key={p.id}>
                                                <a href="#" class="people__link" data-id={p.id} data-object={p.objectApiName} onclick={openPerson}>{p.name}</a>
                                                <template if:true={p.held}><span class="people__held">agent deferred</span></template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            </template>
        </div>
    </lightning-card>
</template>
