<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:sparkles" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Growth Agent &mdash; Today</span>
                    </h2>
                </div>
            </header>
            <template if:true={hasRows}>
                <div class="slds-no-flex">
                    <span class="slds-badge">{count}</span>
                </div>
            </template>
        </div>
        <div class="slds-card__body">
            <template if:true={isLoading}>
                <!-- reserves the card's height so the components below do not jump
                     when the rows arrive -->
                <div class="skel" aria-busy="true" aria-label="Loading today's list">
                    <div class="skel__head"></div>
                    <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
                    <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-p-horizontal_medium slds-p-vertical_small">
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="alert">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>Can't read the {listLabel} list view, so nothing is being shown. This is not an empty queue.</p>
                            <p class="state-detail slds-m-top_xx-small">{errorDetail}</p>
                            <p class="slds-m-top_xx-small">Check that the list view exists and that you have access to it, then try again.</p>
                        </div>
                    </div>
                    <div class="slds-m-top_x-small">
                        <lightning-button
                            label="Reload to check again"
                            onclick={handleRetry}
                            disabled={isRefreshing}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={isUnreadable}>
                <div class="slds-p-horizontal_medium slds-p-vertical_small">
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning" role="alert">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>
                                The {listLabel} list view answered at {checkedAt}, but not with rows this
                                component recognises. There may well be leads waiting, so treat the queue as
                                unknown rather than clear.
                            </p>
                            <p class="slds-m-top_xx-small">
                                Open the list view directly to work today's leads, and tell an admin the
                                Today queue response no longer matches what the component reads.
                            </p>
                        </div>
                    </div>
                    <div class="slds-m-top_x-small">
                        <lightning-button
                            label="Reload to check again"
                            onclick={handleRetry}
                            disabled={isRefreshing}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-align_center">
                    <div class="state-block" role="status">
                        <h3 class="slds-text-heading_small">Queue clear</h3>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            {emptyDetail}
                        </p>
                        <div class="slds-m-top_small">
                            <lightning-button
                                label="Reload to check again"
                                onclick={handleRetry}
                                disabled={isRefreshing}
                            ></lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={hasRows}>
                <p class="slds-text-heading_medium slds-p-horizontal_medium slds-p-bottom_x-small">
                    {headline}
                </p>
                <div class="qscroll">
                <div class="segs" role="group" aria-label="Filter the list">
                    <template for:each={segments} for:item="sg">
                        <button
                            key={sg.key}
                            class={sg.cls}
                            data-seg={sg.key}
                            aria-pressed={sg.pressed}
                            onclick={handleSegment}
                        >{sg.label}</button>
                    </template>
                </div>
                <template for:each={rows} for:item="r">
                    <button key={r.id} class="qrow" data-id={r.id} data-object={r.objectApiName} onclick={handleOpen}>
                        <span class="qrow__pos">{r.pos}</span>
                        <span class={r.scoreClass}>{r.score}</span>
                        <span class="qrow__body">
                            <span class="qrow__name">{r.name} <span class="qrow__co">&middot; {r.company}</span></span>
                            <span class="qrow__why"><span class="qrow__k">Why now</span>{r.whyShort}</span>
                            <span class="qrow__meta">{r.kind} &middot; rank {r.rank}</span>
                        </span>
                        <span class={r.statusClass} title={r.statusHelp}>{r.statusLabel}</span>
                    </button>
                </template>
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-p-horizontal_medium slds-p-vertical_x-small">
                    Updated {checkedAt}
                </p>
            </template>
        </div>
    </article>
</template>
