<template>
    <lightning-card title="Growth Agent briefing" icon-name="utility:sparkles">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={isLoading}>
                <div class="skel" aria-busy="true"><div class="skel__t"></div><div class="skel__t"></div><div class="skel__t"></div><div class="skel__t"></div></div>
            </template>

            <template if:true={hasError}>
                <p class="err" role="alert">
                    Could not read the last run. {errorText}
                </p>
            </template>

            <template if:true={data}>
                <div class="stats">
                    <template for:each={stats} for:item="s">
                        <template if:true={s.nav}>
                            <button key={s.key} class={s.cls} data-segment={s.nav} onclick={openSegment} title={s.help}>
                                <span class="stat__n">{s.n}</span>
                                <span class="stat__l">{s.label}</span>
                                <span class="stat__go">open list</span>
                            </button>
                        </template>
                        <template if:false={s.nav}>
                            <div key={s.key} class={s.cls} title={s.help}>
                                <span class="stat__n">{s.n}</span>
                                <span class="stat__l">{s.label}</span>
                            </div>
                        </template>
                    </template>
                </div>

                <p class="split">{split}</p>

                <template if:true={hasSources}>
                    <p class="lbl">Signals in the last 120 days</p>
                    <div class="srcs">
                        <template for:each={sources} for:item="s">
                            <span key={s.key} class="srcrow">
                                <span class={s.cls}>{s.name}</span>
                                <span class="srcrow__n">{s.count}</span>
                            </span>
                        </template>
                    </div>
                </template>

                <!-- Own block with its own space. A utility class on the button's
                     host did not reliably keep it off the last feed row. -->
                <div class="cta">
                    <lightning-button
                        label="Open today's list"
                        variant="neutral"
                        onclick={openQueue}
                    ></lightning-button>
                    <div class="cta__views" role="group" aria-label="Standard list views">
                        <span class="cta__lbl">List views</span>
                        <lightning-button label="Leads" variant="base" icon-name="utility:list" data-object="Lead" onclick={openListView}></lightning-button>
                        <lightning-button label="Contacts" variant="base" icon-name="utility:list" data-object="Contact" onclick={openListView}></lightning-button>
                    </div>
                </div>

                <p class="run">{runLine}</p>
            </template>
        </div>
    </lightning-card>
</template>
