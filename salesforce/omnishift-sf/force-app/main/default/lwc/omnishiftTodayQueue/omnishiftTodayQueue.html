<template>
    <lightning-card title="Omnishift · Today Queue" icon-name="standard:work_queue">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium queue">
            <div class="header-block slds-m-bottom_medium">
                <h2 class="greeting">{greeting}</h2>
                <p class="work-count">{workCountLabel}</p>
                <lightning-badge label="EXAMPLE DATA" class="slds-m-top_xx-small"></lightning-badge>
            </div>

            <div class="scoreboard slds-m-bottom_medium">
                <p class="section-label">Scoreboard · EXAMPLE DATA</p>
                <lightning-layout multiple-rows>
                    <template for:each={scoreboard} for:item="chip">
                        <lightning-layout-item key={chip.id} size="6" small-device-size="6" medium-device-size="3" padding="around-xx-small">
                            <div class="score-chip">
                                <span class="score-chip__value">{chip.value}</span>
                                <span class="score-chip__label">{chip.label}</span>
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </div>

            <p class="section-label">Queue</p>
            <ul class="queue-list">
                <template for:each={rows} for:item="row">
                    <li key={row.id} class="queue-row">
                        <div class="queue-row__top">
                            <strong class="queue-row__name">{row.name}</strong>
                            <span class={row.tagClass}>{row.tag}</span>
                        </div>
                        <p class="queue-row__reason">{row.reason}</p>
                        <p class="queue-row__detail slds-text-body_small">{row.detail}</p>
                        <p class="queue-row__action">
                            <span class="action-label">Next:</span> {row.action}
                        </p>
                    </li>
                </template>
            </ul>

            <p class="footer-note slds-text-body_small slds-m-top_medium">
                Engine preview · sample data · Phase 1 — not wired to WealthFeed / VisitIQ yet.
                No Claire-vs-Gus matching column in this build.
            </p>
        </div>
    </lightning-card>
</template>
