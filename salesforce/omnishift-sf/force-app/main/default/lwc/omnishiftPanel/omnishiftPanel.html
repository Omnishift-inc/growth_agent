<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:sparkles" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Growth Agent</span>
                    </h2>
                </div>
            </header>
            <template if:true={isScored}>
                <div class="slds-no-flex">
                    <span class="slds-text-body_small slds-text-color_weak">
                        Scored {scoredOn}
                    </span>
                </div>
            </template>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-p-bottom_medium">

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="small" variant="brand"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="alert">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>Can't read Growth Agent fields on this record. Check field-level security.</p>
                    </div>
                </div>
            </template>

            <template if:true={notScored}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-align_center">
                    <div>
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">Not on today's list</h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Growth Agent didn't surface this record in the last run.
                            It'll be reconsidered tonight.
                        </p>
                    </div>
                </div>
            </template>

            <template if:true={isScored}>
                <!-- hero: the score, the reason, the state - one glance -->
                <div class="hero">
                    <div class={scoreBand}>
                        <span class="band__n">{score}</span>
                        <span class="band__l">score</span>
                    </div>
                    <div class="hero__main">
                        <p class="sec sec_why">Why now</p>
                        <p class="hero__why">{whyNow}</p>
                        <div class="hero__chips">
                            <span class="chip chip_rank" title="Position on today's list, across prospects and clients">{rankChip}</span>
                            <span class="chip chip_driver" title={driverHelp}><span class="chip__k">Reason</span>{driverLabel}</span>
                            <span class={complianceChipClass} title={complianceHelp}>{complianceLabel}</span>
                            <template if:true={isEscalated}><span class="chip chip_esc" title="Household above the $10M threshold. John and Deana were notified the first time it was surfaced."><span class="chip__k">Escalated</span>Leadership notified</span></template>
                            <template if:true={outcome}><span class="chip chip_outcome" title="What happened after the outreach, as recorded by the advisor. This is what the ranking learns from."><span class="chip__k">Outcome</span>{outcome}</span></template>
                        </div>
                    </div>
                </div>

                <template if:true={complianceNeedsAttention}>
                    <div class={complianceNoteClass} role="status">
                        <strong>{complianceNoteTitle}</strong>
                        <span>{complianceNoteText}</span>
                        <template if:true={complianceIsBlocked}>
                            <lightning-button label="Rewrite the draft" variant="base" data-disposition="Edited before send" onclick={handleDisposition} class="note__act"></lightning-button>
                        </template>
                    </div>
                </template>
                <template if:true={upcomingSend}>
                    <p class="note note_mkt" role="status">
                        <strong>Marketing is emailing this person on {upcomingSend.when}</strong>
                        <span> - "{upcomingSend.title}", from the Account Engagement calendar. More than three days out, so reaching out today is fine; a send inside the next three days would have held this record back.</span>
                    </p>
                </template>

                <div class="cols">
                    <!-- left: the evidence -->
                    <section class="col">
                        <h3 class="sec">Engagement history</h3>
                        <template if:true={hasTimeline}>
                            <ol class="tls">
                                <template for:each={visibleTimeline} for:item="r">
                                    <li key={r.key} class={r.rowClass}>
                                        <span class="tl__when">{r.when}</span>
                                        <span class="tl__icon"><lightning-icon icon-name={r.iconName} size="xx-small"></lightning-icon></span>
                                        <span class="tl__body">
                                            <span class="tl__head">
                                                <span class="tl__title">{r.title}</span>
                                                <span class={r.sourceClass}>{r.source}</span>
                                            </span>
                                            <template if:true={r.detail}><span class="tl__detail">{r.detail}</span></template>
                                            <template if:true={r.meta}><span class="tl__meta">{r.meta}</span></template>
                                        </span>
                                    </li>
                                </template>
                            </ol>
                            <template if:true={timelineHasMore}>
                                <lightning-button variant="base" label={timelineToggleLabel} onclick={toggleTimeline}></lightning-button>
                            </template>
                        </template>
                        <template if:false={hasTimeline}>
                            <p class="muted">No touches on record yet.</p>
                        </template>
                    </section>

                    <!-- right: what to do with it -->
                    <section class="col col_facts">
                        <h3 class="sec">Next step</h3>
                        <dl class="facts">
                            <dt>Assign to</dt><dd>{recommendedOwner}</dd>
                            <dt>Act by</dt><dd>{nextActionDate}</dd>
                            <template if:true={hasDisposition}><dt>Last recorded</dt><dd>{lastDisposition}</dd></template>
                            <template if:true={dispositionReason}><dt>Note</dt><dd class="muted">{dispositionReason}</dd></template>
                        </dl>
                    </section>
                </div>

                <!-- draft: the toggle is the section header, so what you click and
                     what opens are the same place -->
                <section class="draftsec">
                    <div class="draftsec__head">
                        <h3 class="sec">Draft</h3>
                        <span class="draftsec__subj">{draftHeadline}</span>
                        <template if:true={draftWasEdited}><span class="chip chip_edited" title="An advisor changed this draft after the agent wrote it. The compliance verdict is on the edited text.">Edited by advisor</span></template>
                        <template if:true={draftSubject}>
                            <lightning-button label={draftButtonLabel} variant="base" onclick={toggleDraft}></lightning-button>
                        </template>
                    </div>
                    <template if:true={draftSubject}>
                        <template if:true={showDraft}>
                            <div class="draftwrap">
                                <template if:false={isEditing}>
                                    <div class="envelope">
                                        <div class="envelope__hdr">
                                            <span class="envelope__lbl">From</span><span>{emailFrom}</span>
                                            <span class="envelope__lbl">To</span><span>{emailTo}</span>
                                            <span class="envelope__lbl">Subject</span><span class="envelope__subj">{workingSubject}</span>
                                        </div>
                                        <div class="envelope__body"><lightning-formatted-text value={workingBody}></lightning-formatted-text></div>
                                    </div>
                                    <template if:true={sendModeNote}><p class="muted slds-m-top_x-small">{sendModeNote}</p></template>
                                </template>
                                <template if:true={isEditing}>
                                    <lightning-input label="Subject" value={workingSubject} data-field="subject" onchange={handleDraftChange} class="slds-m-bottom_x-small"></lightning-input>
                                    <lightning-textarea label="Message" value={workingBody} data-field="body" onchange={handleDraftChange}></lightning-textarea>
                                    <div class="slds-m-top_x-small">
                                        <lightning-button label="Save draft" variant="brand" disabled={isSaving} onclick={handleSaveDraft} class="slds-m-right_xx-small"></lightning-button>
                                        <lightning-button label="Cancel" onclick={handleCancelEdit}></lightning-button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                </section>
            </template>
        </div>

        <template if:true={isScored}>
            <footer class="slds-card__footer">
                <template if:true={showSnooze}>
                    <div class="snooze slds-m-bottom_small">
                        <p class="slds-text-title_caps slds-m-bottom_xx-small">Come back to this</p>
                        <lightning-combobox
                            label="When"
                            value={snoozeChoice}
                            options={snoozeOptions}
                            onchange={handleSnoozeChoice}
                        ></lightning-combobox>
                        <template if:true={snoozeIsCustom}>
                            <lightning-input
                                type="date"
                                label="Date"
                                min={todayIso}
                                value={snoozeCustomIso}
                                onchange={handleSnoozeDate}
                                class="slds-m-top_x-small"
                            ></lightning-input>
                            <template if:true={snoozeIsPast}>
                                <p class="slds-text-body_small slds-text-color_error slds-m-top_xx-small" role="alert">
                                    That date has passed. Pick today or later.
                                </p>
                            </template>
                        </template>
                        <div class="slds-m-top_x-small">
                            <lightning-button
                                label={snoozeConfirmLabel}
                                variant="brand"
                                disabled={snoozeConfirmDisabled}
                                onclick={handleConfirmSnooze}
                                class="slds-m-right_xx-small"
                            ></lightning-button>
                            <lightning-button
                                label="Cancel"
                                onclick={handleCancelSnooze}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={stageBanner}>
                    <div class={stageBanner.cls} role="status">
                        <lightning-icon icon-name={stageBanner.icon} size="x-small" class="dstate__icon"></lightning-icon>
                        <div class="dstate__text">
                            <strong>{stageBanner.title}</strong>
                            <span>{stageBanner.text}</span>
                        </div>
                        <template if:true={isSnoozedStage}>
                            <lightning-button label="Bring back today" variant="brand" disabled={isSaving} onclick={handleUndo}></lightning-button>
                            <lightning-button label="Change date" variant="neutral" disabled={isSaving} onclick={handleChangeDate}></lightning-button>
                        </template>
                        <template if:true={isWrongStage}>
                            <lightning-button label="Undo" variant="neutral" disabled={isSaving} onclick={handleUndo}></lightning-button>
                        </template>
                    </div>
                </template>

                <!-- Nothing done yet: the decision. The send is the recommendation,
                     the rest are the ways to not send. -->
                <template if:true={isOpenStage}>
                    <p class="grp__lbl">Your move</p>
                    <div class="acts">
                        <lightning-button
                            variant="brand"
                            label={primaryAction.label}
                            disabled={primaryAction.disabled}
                            data-disposition={primaryAction.key}
                            onclick={handleDisposition}
                            class="acts__primary"
                        ></lightning-button>
                        <template for:each={secondaryActions} for:item="a">
                            <lightning-button
                                key={a.key}
                                label={a.label}
                                variant="neutral"
                                disabled={a.disabled}
                                data-disposition={a.key}
                                onclick={handleDisposition}
                            ></lightning-button>
                        </template>
                        <span class="acts__spacer"></span>
                        <lightning-button
                            variant="base"
                            label="Wrong person"
                            disabled={wrongPersonDisabled}
                            data-disposition="Wrong person"
                            onclick={handleDisposition}
                            class="acts__wrong"
                        ></lightning-button>
                    </div>
                    <template if:true={sendFootnote}><p class="acts__note">{sendFootnote}</p></template>
                </template>

                <!-- Something was done: what came of it. Pills, not buttons - this
                     is a label the ranking learns from, not another command. -->
                <template if:true={showOutcome}>
                    <p class="grp__lbl">{outcomePrompt}</p>
                    <div class="pills" role="group" aria-label="Outcome">
                        <template for:each={outcomeOptions} for:item="o">
                            <button key={o.key} class={o.cls} aria-pressed={o.pressed}
                                disabled={o.disabled} data-outcome={o.key} onclick={handleOutcome}>{o.label}</button>
                        </template>
                    </div>
                    <template if:true={showQuietActions}>
                        <div class="acts acts_quiet">
                            <template for:each={quietActions} for:item="a">
                                <lightning-button key={a.key} label={a.label} variant="base" disabled={a.disabled}
                                    data-disposition={a.key} onclick={handleDisposition}></lightning-button>
                            </template>
                            <span class="acts__spacer"></span>
                            <lightning-button variant="base" label="Wrong person" disabled={wrongPersonDisabled}
                                data-disposition="Wrong person" onclick={handleDisposition} class="acts__wrong"></lightning-button>
                        </div>
                    </template>
                </template>

                <template if:true={inQueue}>
                    <div class="queue-nav slds-m-top_small">
                        <template if:true={hasNext}>
                            <lightning-button
                                label={nextLabel}
                                variant={nextVariant}
                                icon-name="utility:chevronright"
                                icon-position="right"
                                onclick={handleNext}
                            ></lightning-button>

                        </template>
                        <template if:true={atQueueEnd}>

                            <lightning-button
                                label="Back to today's queue"
                                variant={nextVariant}
                                onclick={handleBackToQueue}
                            ></lightning-button>
                        </template>
                    </div>
                </template>
            </footer>
        </template>
    </article>
</template>
