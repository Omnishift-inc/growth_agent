<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:sparkles" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Growth Agent</span>
                    </h2>
                </div>
            </header>
            <template if:true={isScored}>
                <div class="slds-no-flex">
                    <span class="slds-text-body_small slds-text-color_weak">
                        Scored {scoredOn}
                    </span>
                </div>
            </template>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-p-bottom_medium">

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="small" variant="brand"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="alert">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>Can't read Growth Agent fields on this record. Check field-level security.</p>
                    </div>
                </div>
            </template>

            <template if:true={notScored}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-align_center">
                    <div>
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">Not on today's list</h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Growth Agent didn't surface this record in the last run.
                            It'll be reconsidered tonight.
                        </p>
                    </div>
                </div>
            </template>

            <template if:true={isScored}>
                <!-- the three things worth knowing before reading anything -->
                <div class="hdr">
                    <div class={scoreBand}>
                        <span class="band__n">{score}</span>
                        <span class="band__l">score</span>
                    </div>
                    <div class="hdr__mid">
                        <div class="hdr__chips">
                            <span class="chip chip_rank">Rank {rank}</span>
                            <template if:true={positionChip}>
                                <span class="chip chip_pos">{positionChip}</span>
                            </template>
                            <span class="chip chip_driver">{driverLabel}</span>
                            <span class={complianceChipClass}>{complianceStatus}</span>
                            <template if:true={isEscalated}>
                                <span class="chip chip_esc">Leadership notified</span>
                            </template>
                        </div>
                        <p class="hdr__why">{whyNow}</p>
                    </div>
                </div>

                <template if:true={complianceNeedsAttention}>
                    <p class="cmpl-note" role="status">{complianceReason}</p>
                </template>
                <template if:true={upcomingSend}>
                    <p class="mkt-note" role="status">
                        Marketing has <strong>{upcomingSend.title}</strong> going to this person on {upcomingSend.when}. Two arrivals in one week read as one firm that cannot coordinate itself.
                    </p>
                </template>

                <!-- engagement history: every touch, one order. The Pardot tab the client
                     pointed at shows opens and clicks; this shows those, the external
                     feeds, what the firm did, and what the agent did, together. -->
                <template if:true={hasTimeline}>
                    <p class="slds-text-title_caps slds-m-bottom_xx-small">Engagement history</p>
                    <ol class="tls slds-m-bottom_medium">
                        <template for:each={timeline} for:item="r">
                            <li key={r.key} class={r.rowClass}>
                                <span class="tl__when">{r.when}</span>
                                <span class="tl__body">
                                    <span class="tl__head">
                                        <span class={r.sourceClass}>{r.source}</span>
                                        <span class="tl__title">{r.title}</span>
                                    </span>
                                    <template if:true={r.detail}>
                                        <span class="tl__detail">{r.detail}</span>
                                    </template>
                                    <template if:true={r.meta}>
                                        <span class="tl__meta">{r.meta}</span>
                                    </template>
                                </span>
                            </li>
                        </template>
                    </ol>
                </template>

                <!-- who and by when, as facts rather than a form -->
                <div class="meta slds-m-bottom_medium">
                    <div class="meta__i"><span class="meta__l">Assign to</span><span class="meta__v">{recommendedOwner}</span></div>
                    <div class="meta__i"><span class="meta__l">Act by</span><span class="meta__v">{nextActionDate}</span></div>
                    <template if:true={hasDisposition}>
                        <div class="meta__i"><span class="meta__l">Last recorded</span><span class="meta__v">{lastDisposition}</span></div>
                    </template>
                </div>

                <!-- draft -->
                <template if:true={draftSubject}>
                    <lightning-button
                        label={draftButtonLabel}
                        variant="neutral"
                        onclick={toggleDraft}
                        class="slds-m-bottom_x-small"
                    ></lightning-button>
                    <template if:true={showDraft}>
                        <div class="slds-box slds-box_xx-small slds-m-bottom_medium">

                            <!-- reading -->
                            <template if:false={isEditing}>
                                <div class="envelope">
                                    <div class="envelope__hdr">
                                        <span class="envelope__lbl">From</span><span>{emailFrom}</span>
                                        <span class="envelope__lbl">To</span><span>{emailTo}</span>
                                        <span class="envelope__lbl">Subject</span><span class="envelope__subj">{workingSubject}</span>
                                    </div>
                                    <div class="envelope__body">
                                        <lightning-formatted-text value={workingBody}></lightning-formatted-text>
                                    </div>
                                </div>
                            </template>

                            <!-- editing -->
                            <template if:true={isEditing}>
                                <lightning-input
                                    label="Subject"
                                    value={workingSubject}
                                    data-field="subject"
                                    onchange={handleDraftChange}
                                    class="slds-m-bottom_x-small"
                                ></lightning-input>
                                <lightning-textarea
                                    label="Message"
                                    value={workingBody}
                                    data-field="body"
                                    onchange={handleDraftChange}
                                ></lightning-textarea>
                                <div class="slds-m-top_x-small">
                                    <lightning-button
                                        label="Save draft"
                                        variant="brand"
                                        disabled={isSaving}
                                        onclick={handleSaveDraft}
                                        class="slds-m-right_xx-small"
                                    ></lightning-button>
                                    <lightning-button
                                        label="Cancel"
                                        onclick={handleCancelEdit}
                                    ></lightning-button>
                                </div>
                            </template>

                            <template if:false={isEditing}>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                    {sendModeNote}
                                </p>
                            </template>
                        </div>
                    </template>
                </template>

                <template if:true={dispositionReason}>
                    <p class="disp-reason">{dispositionReason}</p>
                </template>
            </template>
        </div>

        <template if:true={isScored}>
            <footer class="slds-card__footer">
                <template if:true={showSnooze}>
                    <div class="snooze slds-m-bottom_small">
                        <p class="slds-text-title_caps slds-m-bottom_xx-small">Come back to this</p>
                        <lightning-combobox
                            label="When"
                            value={snoozeChoice}
                            options={snoozeOptions}
                            onchange={handleSnoozeChoice}
                        ></lightning-combobox>
                        <template if:true={snoozeIsCustom}>
                            <lightning-input
                                type="date"
                                label="Date"
                                min={todayIso}
                                value={snoozeCustomIso}
                                onchange={handleSnoozeDate}
                                class="slds-m-top_x-small"
                            ></lightning-input>
                            <template if:true={snoozeIsPast}>
                                <p class="slds-text-body_small slds-text-color_error slds-m-top_xx-small" role="alert">
                                    That date has passed. Pick today or later.
                                </p>
                            </template>
                        </template>
                        <div class="slds-m-top_x-small">
                            <lightning-button
                                label={snoozeConfirmLabel}
                                variant="brand"
                                disabled={snoozeConfirmDisabled}
                                onclick={handleConfirmSnooze}
                                class="slds-m-right_xx-small"
                            ></lightning-button>
                            <lightning-button
                                label="Cancel"
                                onclick={handleCancelSnooze}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <div class="acts">
                    <lightning-button
                        variant="brand"
                        label={primaryAction.label}
                        disabled={primaryAction.disabled}
                        data-disposition={primaryAction.key}
                        onclick={handleDisposition}
                        class="acts__primary"
                    ></lightning-button>
                    <template for:each={secondaryActions} for:item="a">
                        <lightning-button
                            key={a.key}
                            label={a.label}
                            variant="neutral"
                            disabled={a.disabled}
                            data-disposition={a.key}
                            onclick={handleDisposition}
                        ></lightning-button>
                    </template>
                </div>
                <div class="acts__foot">
                    <p class="acts__note">{sendFootnote}</p>
                    <lightning-button
                        variant="base"
                        label="Wrong person"
                        disabled={wrongPersonDisabled}
                        data-disposition="Wrong person"
                        onclick={handleDisposition}
                        class="acts__wrong"
                    ></lightning-button>
                </div>

                <template if:true={inQueue}>
                    <div class="queue-nav slds-m-top_small">
                        <template if:true={hasNext}>
                            <lightning-button
                                label={nextLabel}
                                variant={nextVariant}
                                icon-name="utility:chevronright"
                                icon-position="right"
                                onclick={handleNext}
                            ></lightning-button>
                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                Same order as the Home queue. Goes straight to the next person.
                            </span>
                        </template>
                        <template if:true={atQueueEnd}>
                            <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small">
                                Last one on today's list.
                            </span>
                            <lightning-button
                                label="Back to today's queue"
                                variant={nextVariant}
                                onclick={handleBackToQueue}
                            ></lightning-button>
                        </template>
                    </div>
                </template>
            </footer>
        </template>
    </article>
</template>
